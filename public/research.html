<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SocietyGuard · Research responses</title><meta name="robots" content="noindex,nofollow"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/style.css"></head><body><main class="admin"><a class="brand" href="/">◈ SocietyGuard</a><div class="card"><div class="eyebrow">RESEARCH TEAM ONLY</div><h1 style="font-size:36px">Your survey responses</h1><p>Download all submitted feedback as a spreadsheet-compatible CSV. Each response contains one row per test.</p><form id="export"><label for="key">Research access key</label><input id="key" type="password" autocomplete="off" required minlength="24"><button class="primary">Download responses</button><p id="message" role="status"></p></form></div><p>Share the survey home page with consumers. Keep this access key with the research team.</p></main><script type="module">document.querySelector('form').onsubmit=async e=>{e.preventDefault();const btn=document.querySelector('button'),msg=document.querySelector('#message');btn.disabled=true;msg.textContent='Preparing your download…';try{const r=await fetch('/api/export',{headers:{Authorization:'Bearer '+document.querySelector('#key').value}});if(!r.ok){const d=await r.json();throw Error(d.error);}const url=URL.createObjectURL(await r.blob());const a=document.createElement('a');a.href=url;a.download='societyguard-responses.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);msg.textContent='Your CSV is downloaded.';}catch(e){msg.textContent=e.message;}finally{btn.disabled=false;}};</script></body></html>
